<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script src="scripts/studentDetails.js" defer></script>
</head>

<body>
    <div class="container mt-5">

        <h1 class="text-center mb-4">Student Details</h1>

        <div class="card mx-auto shadow" style="max-width: 600px;">
            <div class="card-header bg-dark text-white">
                Student Information
            </div>

            <div class="card-body">

                <p id="statusMessage" class="text-center">
                    Loading student details...
                </p>

                <div id="studentDetails" hidden>
                    <p><strong>Enrollment:</strong> <span id="enrollment"></span></p>
                    <p><strong>Name:</strong> <span id="name"></span></p>
                    <p><strong>Course:</strong> <span id="course"></span></p>
                    <p><strong>Batch:</strong> <span id="batch"></span></p>
                    <p><strong>Email:</strong> <span id="email"></span></p>
                    <p><strong>Phone:</strong> <span id="phone"></span></p>
                    <p><strong>Department:</strong> <span id="department"></span></p>
                    <p><strong>Gender:</strong> <span id="gender"></span></p>
                    <p><strong>CGPA:</strong> <span id="cgpa"></span></p>
                </div>

                <a href="index.html" class="btn btn-secondary mt-3">
                    Back to Students
                </a>

            </div>
        </div>

    </div>
</body>

</html>
