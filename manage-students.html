<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="scripts/manageStudents.js" defer></script>
</head>
<body>
    <div class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
            <h1 class="mb-0">Manage Students</h1>
            <a href="index.html" class="btn btn-outline-secondary">Back to Student Database</a>
        </div>

        <div id="statusMessage" class="alert d-none" role="alert"></div>

        <div class="card shadow-sm mb-5">
            <div class="card-header bg-dark text-white">
                <h2 class="h5 mb-0">Add a Student</h2>
            </div>
            <div class="card-body">
                <form id="studentForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="studentEnrollment" class="form-label">Enrollment Number</label>
                            <input id="studentEnrollment" name="studentEnrollment" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="studentName" class="form-label">Full Name</label>
                            <input id="studentName" name="studentName" class="form-control" minlength="2" maxlength="100" required>
                        </div>
                        <div class="col-md-6">
                            <label for="studentCourse" class="form-label">Course</label>
                            <input id="studentCourse" name="studentCourse" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="studentBatch" class="form-label">Batch Year</label>
                            <input id="studentBatch" name="studentBatch" type="number" min="0" step="1" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="studentEmail" class="form-label">Email</label>
                            <input id="studentEmail" name="studentEmail" type="email" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="studentPhone" class="form-label">Phone</label>
                            <input id="studentPhone" name="studentPhone" type="tel" pattern="\+?[0-9]{10,15}" class="form-control" placeholder="9876543210 or +919876543210" required>
                            <div class="form-text">Enter 10–15 digits, optionally starting with +.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="studentDepartment" class="form-label">Department</label>
                            <input id="studentDepartment" name="studentDepartment" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="studentGender" class="form-label">Gender</label>
                            <select id="studentGender" name="studentGender" class="form-select" required>
                                <option value="">Select gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="studentCgpa" class="form-label">CGPA (0–10)</label>
                            <input id="studentCgpa" name="studentCgpa" type="number" min="0" max="10" step="0.01" class="form-control" required>
                        </div>
                    </div>
                    <button id="addStudentButton" type="submit" class="btn btn-primary mt-4">Add Student</button>
                </form>
            </div>
        </div>

        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
            <h2 class="h4 mb-0">Existing Students</h2>
            <button id="refreshButton" type="button" class="btn btn-outline-primary">Refresh List</button>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-bordered align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Enrollment</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Batch</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <tr><td colspan="5" class="text-center">Loading students...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
